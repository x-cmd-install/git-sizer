"RA_kwDOBxtGaM4sUyOm","name":"git-sizer-1.6.0-linux-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3439106,"digest":"sha256:392d01906c0e787c2bdc9e6e8b172a7e2004cb36c0ae592f15f00fc81bc88862","download_count":38,"created_at":"2026-11-13T12:50:31Z","updated_at":"2026-11-13T12:50:31Z"},{"id":743646122,"node_id":"RA_kwDOBxtGaM4sUyOq","name":"git-sizer-1.6.0-windows-386.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3364972,"digest":"sha256:b6f487496e2a955c24f3798f60fdc2fee9c1f3c60e50df1328b1769c5be3c023","download_count":6,"created_at":"2026-11-13T12:50:31Z","updated_at":"2026-11-13T12:50:32Z"},{"id":743646145,"node_id":"RA_kwDOBxtGaM4sUyPB","name":"git-sizer-1.6.0-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3458327,"digest":"sha256:f730701270ef9a16cc9f3bd27074f80e517d10e88f50493f643abad8415352c0","download_count":55,"created_at":"2026-11-13T12:50:32Z","updated_at":"2026-11-13T12:50:32Z"}],"body":"The emphasis of this release is supporting SHA-256 Git repositories, allowing arbitrary reachability roots on the command line, and rebuilding release binaries statically with Go 1.27.3.\r\n\r\n## What's new:\r\n\r\n* Add support for Git repositories using the `sha256` object format.\r\n* Allow arbitrary reachability roots (`git-sizer [OPTS] [ROOT...]`) to be specified on the command line (any revision `git rev-parse` resolves, such as `main`, `main~:src`, or an object ID). When `ROOT` arguments are given without reference selection options, only objects reachable from those roots are traversed.\r\n* Improve bare vs. worktree repository detection so `git-sizer` works when `safe.bareRepository=explicit` is set.\r\n* Avoid `git config` flags that require Git 2.18+ (`--default`, `--type=bool`, `--type=int`) for compatibility with older Git installations.\r\n\r\n## Internal changes:\r\n\r\n* Replace the internal `pipe` package with `github.com/github/go-pipe`.\r\n* Update source installation docs to use `go install` instead of `go get`.\r\n* Automate draft release creation via GitHub Actions and pin workflow actions to commit SHAs.\r\n* Disable `cgo` (`CGO_ENABLED=0`) when building release archives so Linux binaries are statically linked.\r\n* Build with the Go 1.27.3 toolchain.","reactions":{"total_count":4,"+1":1,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
